<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALPHABET TRAIN | SEY GAMERZ</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101e;color:#fff;font-family:system-ui,Arial;min-height:100vh}main{max-width:900px;margin:auto;padding:15px}.card{background:#10213a;border:1px solid #2b4566;border-radius:24px;padding:22px;box-shadow:0 18px 55px #0007}.screen{display:none}.active{display:block}h1{text-align:center;font-size:clamp(34px,8vw,58px);margin:0}.sub{text-align:center;color:#aabbd0}.form{max-width:520px;margin:22px auto;display:grid;gap:11px}input,select,button{width:100%;padding:14px;border-radius:13px;font:inherit}input,select{background:#071525;color:#fff;border:1px solid #2b4566}button{border:0;background:#00d4ff;font-weight:900;cursor:pointer}.gold{background:#ffd166;color:#17100a}.red{background:#ff5575;color:#fff}.dark{background:#263b58;color:#fff}.code{text-align:center;font-size:38px;font-weight:1000;letter-spacing:3px;color:#00d4ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#081626;padding:13px;border-radius:15px;text-align:center}.stat b{display:block;font-size:25px}.letter{width:130px;height:130px;border:5px solid #00d4ff;border-radius:50%;display:grid;place-items:center;margin:18px auto;font-size:70px;font-weight:1000}.cat{text-align:center;color:#ffd166;font-size:21px;font-weight:900}.timer{text-align:center;font-size:42px;font-weight:1000}.msg{text-align:center;min-height:28px;font-weight:800;margin:13px}.good{color:#35e49b}.bad{color:#ff637d}.player{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #2b4566}.hostpanel{border:1px solid #ffd166;border-radius:18px;padding:15px;margin-top:15px}.hostlabel{text-align:center;color:#ffd166;font-weight:900}.hide{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><main>
<section id="home" class="screen active card"><div style="text-align:center;font-size:58px">🚂🔤🎯</div><h1>ALPHABET TRAIN</h1><p class="sub">SEY GAMERZ Multiplayer</p>
<div class="form"><input id="name" placeholder="Enter your name"><select id="category"><option>Place</option><option>Animal</option><option>Food</option><option>Name</option><option>Job</option><option>Thing</option><option>Brand</option></select><button onclick="host()">HOST GAME 🎮</button><div style="text-align:center;color:#9fb0c8">— OR —</div><input id="joinCode" placeholder="Room code e.g. SG4821"><button class="dark" onclick="join()">JOIN GAME 🚀</button></div><div id="homeMsg" class="msg"></div></section>

<section id="lobby" class="screen card"><h2 style="text-align:center">🎮 HOST / PLAYER LOBBY</h2><div class="code" id="code">SG0000</div><p class="sub">Share this code with your players.</p><div id="players"></div>
<div id="hostPanel" class="hostpanel hide"><div class="hostlabel">👑 HOST CONTROL PANEL</div><div class="form"><button class="gold" onclick="start()">START GAME 🎯</button><button class="red" onclick="endGame()">END GAME</button></div></div><div id="lobbyMsg" class="msg"></div></section>

<section id="game" class="screen card"><div class="grid"><div class="stat">ROUND<b id="round">1</b></div><div class="stat">TIME<b id="time">45</b></div></div>
<div class="letter" id="letter">A</div><div class="cat" id="cat">PLACE</div><p class="sub">Find a word starting with this letter.</p>
<div id="playerAnswer" class="form"><input id="answer" placeholder="Your answer"><button onclick="answer()">SUBMIT 🎯</button></div>
<div id="hostGamePanel" class="hostpanel hide"><div class="hostlabel">👑 HOST CONTROL PANEL</div><div class="form"><button id="nextBtn" class="gold hide" onclick="next()">NEXT ROUND ➜</button><button class="red" onclick="endGame()">END GAME</button></div></div>
<div id="gameMsg" class="msg"></div><h3>🏆 LIVE LEADERBOARD</h3><div id="board"></div></section>
</main><script>
const s=io();let hostMode=false,code="";
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function msg(id,t,c=""){ $(id).textContent=t;$(id).className="msg "+c}
function host(){s.emit("host:create",{name:$("name").value,category:$("category").value},r=>{if(!r.ok)return msg("homeMsg",r.error,"bad");hostMode=true;code=r.code;show("lobby");$("code").textContent=code})}
function join(){s.emit("player:join",{name:$("name").value,code:$("joinCode").value},r=>{if(!r.ok)return msg("homeMsg",r.error,"bad");hostMode=false;code=$("joinCode").value.toUpperCase();show("lobby")})}
function start(){s.emit("host:start")}
function next(){s.emit("host:next")}
function endGame(){s.emit("host:end")}
function answer(){s.emit("player:answer",{answer:$("answer").value},r=>{if(!r.ok)msg("gameMsg",r.error,"bad")})}
function render(r){code=r.code;$("code").textContent=r.code;$("players").innerHTML=r.players.map(p=>`<div class="player">👤 ${esc(p.name)} <b>${p.score}</b></div>`).join("");
if(r.state==="lobby"){show("lobby");$("hostPanel").classList.toggle("hide",!hostMode)}
else{$("hostPanel").classList.add("hide");show("game");$("round").textContent=r.round;$("letter").textContent=r.letter;$("cat").textContent=r.category.toUpperCase();$("time").textContent=r.time;$("hostGamePanel").classList.toggle("hide",!hostMode);$("board").innerHTML=r.players.sort((a,b)=>b.score-a.score).map(p=>`<div class="player">👤 ${esc(p.name)} <b>${p.score}</b></div>`).join("");if(r.state==="result")$("nextBtn").classList.toggle("hide",!hostMode);else $("nextBtn").classList.add("hide");$("playerAnswer").classList.toggle("hide",hostMode)}}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
s.on("room",render);s.on("time",t=>$("time").textContent=t);s.on("roundResult",x=>{if(x.name)msg("gameMsg",`🎯 ${x.name} wins with ${x.answer}! +1 POINT`,"good");else msg("gameMsg","⏰ Time's up!","bad")});s.on("hostLeft",()=>{alert("The host ended the game.");location.reload()});s.on("gameEnded",()=>{alert("Game ended by host.");location.reload()});
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")answer()});
</script></body></html>
